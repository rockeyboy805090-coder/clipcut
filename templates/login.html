<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — ClipCut</title>
<style>
body{background:#0d1230;color:#f4f4f5;font-family:sans-serif;margin:0}
main{max-width:420px;margin:60px auto;padding:0 20px}
h1{font-size:26px;text-transform:uppercase}
p{color:#a5b4fc}
.card{background:#171c44;border:1px solid #262c5e;border-radius:14px;padding:22px;margin-top:18px}
input{width:100%;background:#0d1230;border:1px solid #3b4380;border-radius:10px;color:#fff;padding:11px;margin-top:6px;box-sizing:border-box}
label{display:block;margin-top:14px;font-size:14px;color:#c7d2fe}
.btn{display:block;width:100%;background:#ff2e63;color:#fff;border:0;border-radius:999px;padding:12px;font-weight:700;cursor:pointer;margin-top:18px;font-size:16px}
.google{display:block;text-align:center;background:#fff;color:#111827;border-radius:999px;padding:12px;font-weight:700;text-decoration:none;margin-top:6px}
.err{background:#7f1d1d;border-radius:10px;padding:10px;margin-top:14px;font-size:14px}
a{color:#f9a8d4}
</style>
</head>
<body>
<main>
<h2>ClipCut</h2>
<h1>Welcome back</h1>
<p>Sign in to get back to your clips.</p>
<div class="card">
<a class="google" href="/auth/google">Sign in with Google</a>
<p style="text-align:center;font-size:13px">— or sign in by email —</p>
<form method="post" action="/login">
<label>Email<input name="email" type="email" required></label>
<label>Password<input name="password" type="password" required></label>
<div class="err" __ERROR_ATTR__>__ERROR__</div>
<button class="btn" type="submit">Sign in</button>
</form>
<p style="font-size:14px;margin-top:16px">New to ClipCut? <a href="/signup">Create an account</a></p>
</div>
</main>
</body>
</html>
